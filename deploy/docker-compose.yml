# One small server runs everything: the app, PostgreSQL, and Caddy for HTTPS.
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: nexus
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@db:5432/nexus
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      TRUST_PROXY: "1"
    volumes:
      - uploads:/data/uploads

  # A dump of the database and an archive of the photos every night, kept 14 days in the "backups" volume.
  # They are on the same server: copy them elsewhere too (docs/pilot.md).
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: nexus
      PGDATABASE: nexus
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["/bin/bash", "-c", "while true; do /bin/bash /backup.sh || echo 'backup failed'; sleep 86400; done"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  uploads:
  backups:
  caddy:
